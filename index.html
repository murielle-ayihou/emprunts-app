<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f2" />
    <meta name="description" content="Cursus : cours interactifs, exercices, quiz et simulateurs pour réviser tes matières." />
    <title>Cursus</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter un flash
      try {
        var s = JSON.parse((localStorage.getItem('cursus:settings') || localStorage.getItem('echeance:settings')) || '{}')
        var t = s.theme || 'system'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
